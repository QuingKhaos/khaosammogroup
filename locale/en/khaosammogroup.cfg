[item-group-name]
ammo=Ammo

[mod-setting-name]
khaosammogroup-disable-new-subgroups=[color=green][font=heading-2]Compatibility[/font][/color] Disable new ammo subgroups

[mod-setting-description]
khaosammogroup-disable-new-subgroups=If enabled, all ammo will be placed in the default ammo subgroup and no new ammo subgroups will be added by this mod. This is useful for compatibility with other mods that add similar subgroups and thus cause conflicts and startup crashes.

[mod-name]
khaosammogroup=QuingKhaos' Ammo Group

[mod-description]
khaosammogroup=Adds a new Ammo group to the crafting menu. Drop-in replacement for BlacklightSorane's AmmoGroup for 2.1, supports 2.0 too.
